<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>محرر الدعوات السريع | اصنع دعوتك بنفسك</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Space+Grotesk:wght@600;700&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="src/css/tokens.css">
  <link rel="stylesheet" href="src/css/reset.css">
  <link rel="stylesheet" href="src/css/components.css">

  <style>
    .builder-wrap { width: 100%; max-width: 480px; padding: 18px; margin: 0 auto; }
    .form-card { background: var(--surface); border: 1px solid var(--surface-border); border-radius: 16px; padding: 22px 16px; margin-bottom: 20px; text-align: right; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .field-lbl { display: block; font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; }
  </style>
</head>
<body>

  <div class="builder-wrap">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
      <h2 style="font-size:20px; color:#fff;">محرر الدعوة الذكي 💍</h2>
      <span style="font-size:11px; background:rgba(197,160,89,0.15); color:var(--gold); padding:4px 10px; border-radius:20px; font-weight:bold;">معاينة فورية</span>
    </div>

    <div class="form-card">
      <h3 style="font-size:16px; color:#fff; margin-bottom:15px;">👰 بيانات العروسين والمناسبة</h3>
      
      <div class="grid-2">
        <div>
          <label class="field-lbl">اسم العريس</label>
          <input type="text" class="text-input" id="bGroom" value="أحمد" oninput="syncPreview()">
        </div>
        <div>
          <label class="field-lbl">اسم العروسة</label>
          <input type="text" class="text-input" id="bBride" value="منى" oninput="syncPreview()">
        </div>
      </div>

      <div class="grid-2">
        <div>
          <label class="field-lbl">تاريخ الفرح</label>
          <input type="date" class="text-input" id="bDate" value="2027-07-15" onchange="syncPreview()">
        </div>
        <div>
          <label class="field-lbl">ساعة الحفل</label>
          <input type="time" class="text-input" id="bTime" value="20:00" onchange="syncPreview()">
        </div>
      </div>

      <div style="margin-bottom:12px;">
        <label class="field-lbl">اسم القاعة والعنوان</label>
        <input type="text" class="text-input" id="bVenue" value="قاعة فيردي - التجمع الخامس" oninput="syncPreview()">
      </div>

      <div>
        <label class="field-lbl">رابط موقع القاعة (Google Maps)</label>
        <input type="text" class="text-input" id="bMap" value="https://maps.google.com/?q=New+Cairo" oninput="syncPreview()">
      </div>
    </div>

    <!-- شاشة الموبايل في المعاينة -->
    <div style="text-align:center; margin-bottom:20px;">
      <p style="font-size:12px; color:var(--text-muted); margin-bottom:8px;">👀 شكل الدعوة الحقيقي على تليفون الضيف:</p>
      
      <div class="screen-frame" style="box-shadow:0 15px 40px rgba(0,0,0,0.6); min-height:420px; padding:25px 18px; text-align:center;">
        <span style="font-family:var(--font-mono); font-size:9px; letter-spacing:2px; color:#777;">THE WEDDING ISSUE</span>
        <h2 style="font-family:var(--font-serif); font-size:32px; color:#fff; margin:10px 0;" id=
