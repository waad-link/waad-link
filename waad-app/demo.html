<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>معرض ثيمات وعد التفاعلي | جرّب بنفسك 💍</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cinzel:wght@700&family=Space+Grotesk:wght@600;700&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="src/css/tokens.css">
  <link rel="stylesheet" href="src/css/reset.css">
  <link rel="stylesheet" href="src/css/components.css">

  <style>
    .theme-nav-bar { width:100%; max-width:440px; background:#14161f; padding:10px 8px; display:flex; gap:6px; overflow-x:auto; position:sticky; top:0; z-index:100; border-bottom:1px solid #252836; }
    .theme-nav-btn { flex:1; min-width:85px; padding:8px 6px; font-size:11px; font-weight:700; border:1px solid #333; background:#1c1f2b; color:#aaa; border-radius:20px; cursor:pointer; white-space:nowrap; text-align:center; }
    .theme-nav-btn.active { background:#fff; color:#000; border-color:#fff; }
    .demo-view { display:none; width:100%; min-height:100dvh; }
    .demo-view.active { display:block; animation:fadeIn 0.3s ease; }
    @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
  </style>
</head>
<body>

  <!-- شريط التبديل العلوي للمعرض -->
  <div class="theme-nav-bar">
    <button class="theme-nav-btn active" onclick="switchDemo('ticket', this)">🎫 التذكرة</button>

    <button class="theme-nav-btn" onclick="switchDemo('scratch', this)">✨ كارت الخدش</button>
    <button class="theme-nav-btn" onclick="switchDemo('vogue', this)">📰 Vogue</button>
  </div>

  <div class="screen-frame">

    <div id="demo-ticket" class="demo-view active" style="padding:40px 18px; text-align:center;">

          <p style="font-size:12px; color:#666; margin-bottom:15px;">📍 مطعمنا المفضل على النيل</p>
          <button class="btn-action btn-gold" onclick="alert('🎉 تم تأكيد وقبول السهرة بنجاح!')" style="background:#d90429; color:#fff;">تأكيد وقبول السهرة 🤍</button>
        </div>
      </div>
    </div>

    <!-- 2. ثيم شات الواتساب -->

      <div style="display:flex; flex-direction:column; gap:12px; text-align:right;">
        <div style="max-width:85%; padding:12px 15px; border-radius:16px 16px 4px 16px; background:#1b252d; color:#fff; font-size:14px;">

        </div>

        </div>
        <div style="max-width:85%; padding:12px 15px; border-radius:16px 16px 4px 16px; background:#005c4b; color:#fff; font-size:14px;">
          فرحنا هيكون يوم الخميس 15 يوليو 💍 هتنورنا؟
        </div>
      </div>
    </div>
